<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8" />
        <title>Shop Books - Book Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="books-page">
        <!-- header -->
        <div class="div1 montserrat">
            <img class="logo" src="images/book_store_new_logo_v2.gif" />
            <div class="links">
                <a href="index.html">HOME</a>
                <a href="books.html">SHOP</a>
                <a href="new.html">NEW</a>
                <a href="cart.html"><i class="ti ti-shopping-cart"></i></a>
            </div>
        </div>
        <div class="auth-page">
            <div class="auth-card">
                <i class="ti ti-lock auth-icon"></i>
                <h1>Forgot Password?</h1>
                <p>Enter your email and we'll send you a link to reset your password.</p>

                <input type="email" placeholder="Email address" class="auth-input">

                <button class="auth-btn">Send Reset Link</button>

                <a href="login.html" class="auth-back">
                    <i class="ti ti-arrow-left"></i> Back to Login
                </a>
            </div>
        </div>
    </body>
</html>
