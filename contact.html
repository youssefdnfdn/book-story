<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8" />
        <title>Contact Us - Book Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="books-page">
        <!-- header -->
        <div class="div1 montserrat">
            <a href="index.html"><img class="logo" src="images/book_store_new_logo_v2.gif" /></a>
            <div class="links">
                <a href="index.html">HOME</a>
                <a href="books.html">SHOP</a>
                <a href="new.html">NEW</a>
            </div>
        </div>

        <!-- title -->
        <div class="title">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you</p>
        </div>

        <div class="contact-layout">
            <!-- form -->
            <div class="contact-form-card">
                <input class="auth-input" placeholder="Name" required>
                <input type="email" class="auth-input" placeholder="Email" required>
                <input class="auth-input" placeholder="Subject">
                <textarea placeholder="Your message" required></textarea>
                <button class="auth-btn">Send Message</button>
            </div>

            <!-- info -->
            <div class="contact-info-card">
                <h2>Contact Info</h2>
                <div class="contact-info-row"><i class="ti ti-map-pin"></i> Tanta, Egypt</div>
                <div class="contact-info-row"><i class="ti ti-phone"></i> +20 100 000 0000</div>
                <div class="contact-info-row"><i class="ti ti-mail"></i> support@bookstore.com</div>
                <div class="contact-icon">
                    <i class="ti ti-brand-instagram"></i>
                    <i class="ti ti-brand-facebook"></i>
                    <i class="ti ti-brand-x"></i>
                </div>
            </div>
        </div>

        <!-- footer -->
        <div class="footer">
          <p class="footer-tagline playfair-display">Discover your next adventure</p>
          <div class="footer-social">
            <i class="ti ti-brand-instagram"></i>
            <i class="ti ti-brand-facebook"></i>
            <i class="ti ti-brand-x"></i>
          </div>
          <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="books.html">Shop</a>
            <a href="new.html">New</a>
            <a href="contact.html">Contact</a>
          </div>
          <p class="footer-copy">© 2026 Book Store — All rights reserved</p>
        </div>
    </body>
</html>
