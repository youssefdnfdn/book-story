<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <title> register to Book Store</title>
        <link rel="stylesheet" href="style.css"> 
    </head>
        <body class="register">
            <div class="left">
                <h1>DISCOVER YOUR NEXT ADVENTURE</h1>
                <b>Create your account and discover books made for you</b>
                <b>Your next favorite book is waiting for you</b>
            </div>
            <div class="right">
                <div>
                   <h1>Create <br> Account</h1>
                </div>
                <form>
                    <div class="input-wrap2">
                        <i class="ti ti-user"></i>
                        <input type="text" autofocus ... autocomplete="given-name" id="Full name" name=" Full name" placeholder="FUll name" aria-label="Full name " required>
                    </div>
                    <div class="input-wrap2">
                        <i class="ti ti-mail"></i>     
                        <input type="email" autofocus ... autocomplete="email" id="email" name="Email" placeholder="Email" aria-label="Email" required>
                    </div> 
                    <div class="input-wrap2">
                        <i class="ti ti-lock"></i>
                        <input type="password" autofocus ... autocomplete="new-password" id="password" name="password" placeholder="password" aria-label="password" required>
                    </div>
                     <div class="input-wrap2">
                        <i class="ti ti-lock"></i>
                        <input type="password" autofocus ... autocomplete="new-password" id="confirm" name="confirm" placeholder="confirm" aria-label="confirm" required>
                    </div>
                    <label>
                        <input class="check" type="checkbox" required>
                        I agree to the Terms & Privacy Policy
                    </label>
                    <button type="submit">Create Account</button>
                </form>    
            </div>
    </body>
</html>
