<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8" />
        <title> pay page </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="books-page">
        <!-- header -->
        <div class="div1 montserrat">
            <img class="logo" src="images/book_store_new_logo_v2.gif" />
            <div class="links">
                <a href="index.html">HOME</a>
                <a href="books.html">SHOP</a>
                <a href="new.html">NEW</a>
                <a href="cart.html"><i class="ti ti-shopping-cart"></i></a>
            </div>
        </div>
        <!-- page -->
        <div class="cart-title">
            <h1>Checkout</h1>
            <b>Complete your order</b>
        </div>
        
        <div class="cart-page checkout-layout">
            <!-- left: shipping + payment -->
            <div class="shipping-form">
                <h2>Shipping details</h2>
                <input class="auth-input" autofocus placeholder="Full name" required>
                <input class="auth-input" placeholder="Address">
                <div class="form-row">
                    <input class="auth-input" placeholder="City">
                    <input class="auth-input" placeholder="ZIP code">
                </div>
        
                <h2>Payment method</h2>
                <div class="payment-option selected">
                    <i class="ti ti-credit-card"></i>
                    <span>Credit / debit card</span>
                </div>
                <div class="payment-option">
                    <i class="ti ti-brand-paypal"></i>
                    <span>PayPal</span>
                </div>
            </div>
        
            <!-- right: order summary -->
            <div class="summary">
                <h1>Order Summary</h1>
                <div class="total"><h3>Frankenstein</h3><b>$10.99</b></div>
                <div class="total"><h3>The Prince and the Witch</h3><b>$9.99</b></div>
                <div class="total"><h3>Revenant</h3><b>$8.99</b></div>
                <div class="total"><h3>Subtotal</h3><b>$29.97</b></div>
                <div class="total"><h3>Shipping</h3><b>$3.00</b></div>
                <div class="total"><h3>Total</h3><b>$32.97</b></div>
                <button class="checkout-btn">Place order</button>
            </div>
        </div>
    </body>   
</html>
